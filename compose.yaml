services:
  app:
    image: shzlwio/lightflare:0.0.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lightflare
      SPRING_DATASOURCE_USERNAME: lightflare
      SPRING_DATASOURCE_PASSWORD: lightflare
      LIGHTFLARE_LLM_PROVIDER: openai
      LIGHTFLARE_LLM_OPENAI_ENABLED: true
      LIGHTFLARE_LLM_OPENAI_model: gpt-5.4-nano
      LIGHTFLARE_LLM_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8066:8066"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lightflare
      POSTGRES_USER: lightflare
      POSTGRES_PASSWORD: lightflare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightflare -d lightflare"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
