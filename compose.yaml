services:
  app:
    image: shzlwio/lightflare:0.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lightflare
      SPRING_DATASOURCE_USERNAME: lightflare
      SPRING_DATASOURCE_PASSWORD: lightflare
      LIGHTFLARE_BOOTSTRAP_SUPERADMIN_USERNAME: ${LIGHTFLARE_BOOTSTRAP_SUPERADMIN_USERNAME:-}
      LIGHTFLARE_BOOTSTRAP_SUPERADMIN_EMAIL: ${LIGHTFLARE_BOOTSTRAP_SUPERADMIN_EMAIL:-}
      LIGHTFLARE_BOOTSTRAP_SUPERADMIN_PASSWORD: ${LIGHTFLARE_BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      LIGHTFLARE_LLM_PROVIDER: ${LIGHTFLARE_LLM_PROVIDER:-}
      LIGHTFLARE_LLM_OPENAI_ENABLED: ${LIGHTFLARE_LLM_OPENAI_ENABLED:-}
      LIGHTFLARE_LLM_OPENAI_MODEL: ${LIGHTFLARE_LLM_OPENAI_MODEL:-}
      LIGHTFLARE_LLM_OPENAI_API_KEY: ${LIGHTFLARE_LLM_OPENAI_API_KEY:-}
    ports:
      - "8066:8066"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lightflare
      POSTGRES_USER: lightflare
      POSTGRES_PASSWORD: lightflare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightflare -d lightflare"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
